name: Check 3D build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 3d/game.js matches 3d/src
        run: node 3d/build.mjs --check
  walk:
    # opens the 3D world on an iPhone-size screen and checks the character really walks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: npm i --no-save playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: The character walks
        run: node 3d/tests/walk.mjs
      - name: The flying rides take off, fly over the trees and land
        run: node 3d/tests/fly.mjs
      - name: The bike rider sits on the saddle and pedals with the cranks
        run: node 3d/tests/bike.mjs
      - name: The skate park ramps, grinds and tricks work on a board, skates and a bike
        run: node 3d/tests/skate-park.mjs
      - name: The safari rides only come from finishing their Safari challenges, and you sit right on them
        run: node 3d/tests/safari-rides.mjs
      - name: You can swim in Dolphin Bay with the dolphins, the whale and the sea turtle, and ride them once earned
        run: node 3d/tests/ocean.mjs
      - name: The barn animals wander their meadow, and a Round-up sends them round town until they are caught and walked home
        run: node 3d/tests/town-animals.mjs
      - name: The Jump Park trampolines bounce, flip, slam dunk and splash into the foam pit
        run: node 3d/tests/jump-park.mjs
      - name: Every guy haircut looks like its name and hats sit on the hair
        run: node 3d/tests/guy-hair.mjs
      - name: Rosie serves your food at the restaurant, and the delivery rush works
        run: node 3d/tests/restaurant.mjs
      - name: Lookout Mountain and the Treetop Adventure (footbridge, ladder, rope bridges, rock wall, trail, zip lines) work
        run: node 3d/tests/adventure.mjs
      - name: The big world past the canal is there and blocked off, open land works, and the map shows it all
        run: node 3d/tests/big-world.mjs
      - name: Hang glide off Lookout Mountain (thermals, landing) and skydive from the plane at the airfield
        run: node 3d/tests/sky.mjs
      - name: The waterpark's bridge, slides, lazy river, surfing and floating playground work
        run: node 3d/tests/waterpark.mjs
      - name: Your pet swims next to you in the canal and the waterpark instead of walking on the water
        run: node 3d/tests/pet-swim.mjs
      - name: The soccer field - penalty shootout (swipe shots and goalie dives), targets, keepy-uppies and 1-on-1 with tricks
        run: node 3d/tests/soccer.mjs
      - name: Football on the soccer field - field goals, picking a team, a pick-up game with sacks, and kick returns
        run: node 3d/tests/football.mjs
      - name: The Places tab lists every challenge under the place you do it
        run: node 3d/tests/challenge-places.mjs
      - name: The Fast Pass from the shop zips you to every place in town
        run: node 3d/tests/fast-pass.mjs
      - name: Townspeople don't follow you around or copy your moves (only your adopted pet follows)
        run: node 3d/tests/townspeople.mjs
      - name: Christmas in town - the big tree, lights, Santa, snowball fights and snowmen
        run: node 3d/tests/christmas.mjs
      - name: Polar Ice works (skating, ice fishing, igloo, Polar escape) and the polar rides come only from their Polar challenges
        run: node 3d/tests/arctic.mjs
      - name: The 2D and 3D closets match
        run: node 3d/tests/closets-match.mjs
      - name: The helicopter is won or bought, flies over the trees, lands on the Helipad and comes when called
        run: node 3d/tests/helicopter.mjs
      - name: Wiffle ball (bat, pitch, field, Derby)
        run: node 3d/tests/wiffle.mjs
      - name: 3-on-3 basketball - pick a team, pass, call for it, dunk, steal, and the Bears play back
        run: node 3d/tests/basketball-3v3.mjs
      - name: What's new shows once after an update, and the map's NEW tags clear when you visit
        run: node 3d/tests/whats-new.mjs
      - name: Dino Valley - the bridge, real-looking dinosaurs in their paddocks, Meet cards, your own dinosaurs live there (not the barn), riding
        run: node 3d/tests/dino-valley.mjs
      - name: Big dinosaurs - locked until you finish their Dino challenges, the Fossil Dig, sitting on each saddle, the T. rex walks and the pteranodon flies
        run: node 3d/tests/dino-rides.mjs
