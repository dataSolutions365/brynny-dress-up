<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pet Parlor</title>
<meta name="description" content="Dress up a pet cat, dog or squirrel. Under construction.">
<meta name="theme-color" content="#ff8fc1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐾</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pink2:#ffd6ea;--purple:#8e6cff;--ink:#3b2357;--bg:#fff4fa;--muted:#8a7499}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input{font-family:inherit}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(90deg,#ff8fc1,#b79cff);color:#fff}
header a{color:var(--ink);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;text-decoration:none;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
header h1{margin:0;font-size:20px;flex:1;text-align:center;white-space:nowrap}
.tbtn{background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font-weight:700;box-shadow:0 2px 0 rgba(0,0,0,.12);white-space:nowrap}
.wip{background:repeating-linear-gradient(-45deg,#ffd23f 0 12px,#2d2d3a 12px 24px);color:#fff;text-align:center;font-weight:700;font-size:13px;padding:3px 8px}
.wip span{background:#2d2d3a;padding:1px 10px;border-radius:999px}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden}
.stage svg{width:100%;height:100%;display:block}
.pet{transform-origin:150px 290px;cursor:pointer}
.pet.hop{animation:hop .5s ease}
@keyframes hop{30%{transform:translateY(-22px) scaleY(1.04)}60%{transform:translateY(0) scaleY(.94)}}
.wag{transform-origin:205px 255px;animation:wag .6s ease-in-out infinite alternate}
@keyframes wag{from{transform:rotate(-8deg)}to{transform:rotate(10deg)}}
.swish{transform-origin:200px 262px;animation:swish 2.4s ease-in-out infinite alternate}
@keyframes swish{from{transform:rotate(-4deg)}to{transform:rotate(5deg)}}
.blink{animation:blink 4s infinite;transform-box:fill-box;transform-origin:center}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.say{position:absolute;top:10%;left:50%;transform:translateX(-50%);background:#fff;border-radius:18px;padding:8px 16px;font-weight:700;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.18);animation:say 1.2s ease forwards;pointer-events:none}
@keyframes say{0%{opacity:0;transform:translate(-50%,10px)}15%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0}}
.panel{width:min(470px,46vw);display:flex;flex-direction:column;background:#fff;border-left:3px solid var(--pink2);min-height:0}
.pets{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px;border-bottom:2px solid var(--pink2)}
.pets button{border-radius:16px;padding:6px;font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;color:var(--muted)}
.pets button span{font-size:30px;line-height:1.1}
.pets button.on{background:var(--pink2);color:var(--ink)}
.content{flex:1;overflow-y:auto;padding:4px 14px 30px;-webkit-overflow-scrolling:touch}
h3{margin:14px 0 8px;font-size:17px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.item{border:3px solid #f6e3ef;border-radius:16px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;background:#fff9fc;font-size:12.5px;font-weight:600}
.item .big{font-size:28px;line-height:1.15}
.item.on{border-color:var(--pink);background:#ffeaf4}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:38px;height:38px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #eadcf0}
.sw.on{box-shadow:0 0 0 4px var(--pink)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row input{flex:1;min-width:120px;border:3px solid #eadcf0;border-radius:14px;padding:9px 12px;font-size:17px;color:var(--ink)}
.pill{background:var(--pink);color:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:15px}
.pill.soft{background:#f6e3ef;color:var(--ink)}
.soon{margin-top:18px;border:3px dashed #eadcf0;border-radius:16px;padding:10px 12px;color:var(--muted);font-size:14px;line-height:1.4}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 8px;border-bottom:2px solid var(--pink2)}
.modes button{border-radius:999px;padding:8px;font-weight:700;font-size:15px;background:#f6e3ef}
.modes button.on{background:var(--pink);color:#fff}
.stage.care{touch-action:none}
.needs{position:absolute;top:10px;left:10px;background:#fff;border-radius:16px;padding:4px 10px;font-size:20px;box-shadow:0 3px 10px rgba(0,0,0,.15);pointer-events:none}
.hint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);background:rgba(59,35,87,.85);color:#fff;border-radius:999px;padding:5px 14px;font-size:14px;font-weight:600;white-space:nowrap;pointer-events:none}
.float{position:absolute;font-size:26px;pointer-events:none;animation:float 1.1s ease-out forwards}
@keyframes float{from{opacity:1;transform:translateY(0) scale(.7)}to{opacity:0;transform:translateY(-70px) scale(1.2)}}
.bars{display:grid;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr;align-items:center;gap:8px;font-size:14px;font-weight:600}
.bar i{display:block;height:14px;border-radius:999px;background:#f6e3ef;overflow:hidden}
.bar i b{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ff8fc1,#8e6cff);transition:width .3s}
.drip{animation:drip .6s ease-in forwards}
@keyframes drip{to{transform:translateY(40px);opacity:0}}
.puff{animation:puff .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes puff{to{transform:scale(2.2);opacity:0}}
@media (max-width:760px){
  main{flex-direction:column}
  .stage{flex:0 0 42%}
  .panel{width:auto;flex:1;border-left:none;border-top:3px solid var(--pink2)}
  header h1{font-size:17px}
}
</style>
</head>
<body>
<header>
  <a href="./" aria-label="Back to the dress-up game">← Dress-up</a>
  <h1>🐾 Pet Parlor</h1>
  <button class="tbtn" id="randBtn" title="Surprise costume">🎲</button>
</header>
<div class="wip"><span>🚧 Under construction: more coming soon! 🚧</span></div>
<main>
  <div class="stage" id="stage"></div>
  <div class="panel">
    <div class="pets" id="pets"></div>
    <div class="modes" id="modes"></div>
    <div class="content" id="content"></div>
  </div>
</main>
<script>
const $=s=>document.querySelector(s);
const KINDS=[{id:'cat',e:'🐱',name:'Kitty',say:'Meow!'},{id:'dog',e:'🐶',name:'Puppy',say:'Woof woof!'},{id:'squirrel',e:'🐿️',name:'Squirrel',say:'Chitter chatter!'}];
const FUR={cat:['#f4a259','#9aa0a6','#3a3540','#f5efe6','#c9b28f'],dog:['#d9a35b','#8b5a2b','#f3ece2','#3a3036','#c46b3c'],squirrel:['#b06a3b','#8d8d8d','#6b4a32','#d98b4a']};
const COSTUMES=[{id:'none',e:'🐾',name:'Just me'},{id:'pumpkin',e:'🎃',name:'Pumpkin'},{id:'ghost',e:'👻',name:'Ghost'},{id:'witch',e:'🧙',name:'Witch'},{id:'vampire',e:'🧛',name:'Vampire'},{id:'skeleton',e:'💀',name:'Skeleton'},{id:'bat',e:'🦇',name:'Bat wings'},{id:'hero',e:'🦸',name:'Superhero'},{id:'tutu',e:'🩰',name:'Tutu'},{id:'sweater',e:'🧶',name:'Sweater'}];
const HATS=[{id:'none',e:'🚫',name:'No hat'},{id:'witch',e:'🧙',name:'Witch hat'},{id:'pumpkin',e:'🎃',name:'Pumpkin cap'},{id:'horns',e:'😈',name:'Little horns'},{id:'crown',e:'👑',name:'Crown'},{id:'party',e:'🥳',name:'Party hat'},{id:'bow',e:'🎀',name:'Big bow'},{id:'bunny',e:'🐰',name:'Bunny ears'}];
const NECKS=[{id:'none',e:'🚫',name:'Nothing'},{id:'collar',e:'🔔',name:'Bell collar'},{id:'bowtie',e:'🎀',name:'Bow tie'},{id:'bandana',e:'🧣',name:'Bandana'}];
const PLACES=[{id:'spooky',e:'🌙',name:'Spooky night'},{id:'park',e:'🌳',name:'Park'},{id:'room',e:'🏠',name:'Cozy room'}];
const COLORS=['#8e44ad','#ff6fae','#ff4d6d','#ff8a3d','#ffd23f','#7ee081','#2ec4b6','#4fc3f7','#5c7cfa','#2d2d3a'];
const FOODS={cat:[['🐟','Fish'],['🥛','Milk'],['🍗','Chicken']],dog:[['🦴','Bone'],['🍖','Meat'],['🥕','Carrot']],squirrel:[['🌰','Acorn'],['🥜','Peanuts'],['🍓','Berry']]};
const TOOLS={soap:'Rub your pet with soap 🧼',rinse:'Rub to rinse the bubbles off 🚿',dry:'Rub to blow-dry 🌬️',trim:'Tap the fluffy tufts to trim them ✂️',brush:'Rub your pet to brush ✨',clip:'Tap each nail to clip it 🐾',polish:'Tap a nail to paint it 💅'};
const NAILPOS=[[121,290],[130,292],[139,290],[161,290],[170,292],[179,290]];
const MUD=[[122,222,9,6],[178,244,11,7],[146,266,7,5],[112,100,6,4],[196,200,7,5]];
const newCare=()=>({food:55,clean:40,tufts:[0,1,2,3,4,5],grow:0,nails:[1,1,1,1,1,1],polish:[0,0,0,0,0,0],cutAt:0,t:Date.now()});
const KEY='brynny-pets-v1';
let S={kind:'cat',fur:{cat:FUR.cat[0],dog:FUR.dog[0],squirrel:FUR.squirrel[0]},names:{cat:'Pumpkin',dog:'Biscuit',squirrel:'Nutmeg'},
  fit:{cat:{body:'witch',hat:'witch',neck:'none',c:'#8e44ad'},dog:{body:'pumpkin',hat:'none',neck:'bandana',c:'#ff8a3d'},squirrel:{body:'none',hat:'bow',neck:'collar',c:'#ff6fae'}},bg:'spooky',mode:'dress',tool:null,polishC:'#ff6fae',care:{cat:newCare(),dog:newCare(),squirrel:newCare()}};
try{const o=JSON.parse(localStorage.getItem(KEY)||'null');if(o&&o.fit)S=Object.assign(S,o);}catch(e){}
S.tool=null;for(const k of KINDS)S.care[k.id]=Object.assign(newCare(),S.care[k.id]);
let T={foam:[],soaped:0,rinsed:0,wet:0,dry:0,brush:0,last:null,snd:0};
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
function shade(hex,amt){const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;const f=v=>Math.round(amt<0?v*(1+amt):v+(255-v)*amt);return '#'+[f(r),f(g),f(b)].map(v=>Math.max(0,Math.min(255,v)).toString(16).padStart(2,'0')).join('');}
const star=(x,y,r,c)=>{let d='';for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;d+=(i?'L':'M')+(x+Math.cos(a)*rr).toFixed(1)+' '+(y+Math.sin(a)*rr).toFixed(1);}return `<path d="${d}Z" fill="${c}"/>`;};

/* ---------- places ---------- */
function placeSVG(id){
  if(id==='park')return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fdcff"/><stop offset="1" stop-color="#e3f6ff"/></linearGradient></defs>
    <rect x="-400" y="-200" width="1100" height="720" fill="url(#sky)"/><circle cx="255" cy="45" r="22" fill="#ffe066"/>
    <ellipse cx="60" cy="60" rx="34" ry="12" fill="#fff" opacity=".9"/><ellipse cx="85" cy="52" rx="22" ry="12" fill="#fff" opacity=".9"/>
    <rect x="18" y="120" width="16" height="120" rx="6" fill="#8b5a2b"/><circle cx="26" cy="110" r="46" fill="#5fbf5a"/><circle cx="2" cy="130" r="30" fill="#54ad50"/>
    <path d="M-400 250 Q150 225 700 250 L700 520 L-400 520 Z" fill="#7ed36f"/><path d="M-400 270 Q150 255 700 272 L700 520 L-400 520 Z" fill="#69c25c"/>
    ${[[230,262],[250,270],[70,268]].map(([x,y])=>`<circle cx="${x}" cy="${y}" r="4" fill="#fff"/><circle cx="${x}" cy="${y}" r="1.6" fill="#ffd23f"/>`).join('')}`;
  if(id==='room')return `<rect x="-400" y="-200" width="1100" height="720" fill="#ffe3ee"/>${Array.from({length:32},(_,i)=>`<rect x="${-400+i*36}" y="-200" width="14" height="435" fill="#ffd2e4"/>`).join('')}
    <rect x="200" y="40" width="80" height="80" rx="8" fill="#bfe9ff" stroke="#fff" stroke-width="7"/><line x1="240" y1="40" x2="240" y2="120" stroke="#fff" stroke-width="5"/><line x1="200" y1="80" x2="280" y2="80" stroke="#fff" stroke-width="5"/>
    <rect x="-400" y="235" width="1100" height="300" fill="#d9a46a"/>${Array.from({length:22},(_,i)=>`<line x1="${-400+i*52}" y1="235" x2="${-400+i*52}" y2="520" stroke="#c48d55" stroke-width="2"/>`).join('')}
    <ellipse cx="150" cy="292" rx="120" ry="22" fill="#b79cff"/><ellipse cx="150" cy="292" rx="96" ry="15" fill="#d6c6ff"/>`;
  return `<defs><linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1d0f36"/><stop offset="1" stop-color="#4b2a6b"/></linearGradient></defs>
    <rect x="-400" y="-200" width="1100" height="720" fill="url(#night)"/><circle cx="245" cy="55" r="30" fill="#fff6c8"/><circle cx="232" cy="48" r="5" fill="#f0e3a0"/><circle cx="255" cy="66" r="4" fill="#f0e3a0"/>
    ${[[30,30],[80,60],[140,25],[190,90],[20,110],[290,120],[110,95]].map(([x,y],i)=>star(x,y,i%2?3:4.5,'#fff6c8')).join('')}
    <path d="M70 60 q8 -8 16 0 q8 -8 16 0 q-8 2 -16 10 q-8 -8 -16 -10z" fill="#120a20"/>
    <path d="M-400 255 Q150 232 700 255 L700 520 L-400 520 Z" fill="#2c1846"/>
    ${[[40,262,20],[262,266,16],[-10,270,14]].map(([x,y,r])=>`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.8}" fill="#ff8a2b"/><path d="M${x} ${y-r*.8} q2 -7 6 -9" stroke="#5a8a2a" stroke-width="3" fill="none"/><path d="M${x-r*.4} ${y-2} l4 -5 l4 5 z M${x+r*.4-8} ${y-2} l4 -5 l4 5 z M${x-r*.45} ${y+5} q${r*.45} 7 ${r*.9} 0" fill="#ffe066" stroke="#ffe066" stroke-width="1.5"/>`).join('')}`;
}

/* ---------- the pets ---------- */
function petSVG(){
  const k=S.kind,f=S.fur[k],dk=shade(f,-.25),lt=shade(f,.45),care=S.mode==='care',fit=care?{body:'none',hat:'none',neck:'none',c:'#fff'}:S.fit[k],c=fit.c,sq=k==='squirrel';
  const hy=sq?75:67;// top of the head
  let back='',tail='',ears='',earsFront='',face='';
  // costume pieces that go behind the pet
  if(fit.body==='witch')back+=`<path d="M110 165 L66 292 L234 292 L190 165 Z" fill="${c}"/>`;
  if(fit.body==='vampire')back+=`<path d="M100 160 L55 295 L245 295 L200 160 Z" fill="#1a1020"/><path d="M112 168 L80 290 L220 290 L188 168 Z" fill="#b3122e"/><path d="M84 150 L104 92 L136 162 Z M216 150 L196 92 L164 162 Z" fill="#1a1020"/>`;
  if(fit.body==='bat')back+=['M112 192 Q62 150 28 176 Q44 186 38 202 Q58 196 62 214 Q78 202 88 220 Q100 206 114 216 Z','M188 192 Q238 150 272 176 Q256 186 262 202 Q242 196 238 214 Q222 202 212 220 Q200 206 186 216 Z'].map(d=>`<path d="${d}" fill="#2a2233" stroke="#4a3a5a" stroke-width="2"/>`).join('');
  if(fit.body==='hero')back+=`<path d="M108 165 Q90 240 76 296 L224 296 Q210 240 192 165 Z" fill="${c}"/>`;
  if(k==='cat')tail=`<g class="swish"><path d="M200 262 Q262 254 254 196 Q250 166 270 146" stroke="${f}" stroke-width="18" fill="none" stroke-linecap="round"/><path d="M262 158 Q266 150 270 146" stroke="${dk}" stroke-width="18" fill="none" stroke-linecap="round"/></g>`;
  if(k==='dog')tail=`<g class="wag"><path d="M205 255 Q242 238 238 200" stroke="${f}" stroke-width="16" fill="none" stroke-linecap="round"/></g>`;
  if(sq)tail=`<g class="swish"><path d="M188 272 Q272 266 266 182 Q262 118 214 96 Q186 86 198 112 Q236 142 230 192 Q226 244 182 248 Z" fill="${f}"/><path d="M200 258 Q252 250 250 186 Q248 136 214 108" stroke="${lt}" stroke-width="6" fill="none" opacity=".55" stroke-linecap="round"/></g>`;
  if(k==='cat')ears=`<path d="M106 96 L102 44 L144 72 Z M194 96 L198 44 L156 72 Z" fill="${f}"/><path d="M111 86 L109 58 L133 74 Z M189 86 L191 58 L167 74 Z" fill="#ffb3c7"/>`;
  if(sq)ears=`<ellipse cx="114" cy="80" rx="11" ry="18" fill="${f}" transform="rotate(-18 114 80)"/><ellipse cx="186" cy="80" rx="11" ry="18" fill="${f}" transform="rotate(18 186 80)"/><path d="M108 64 l-3 -10 l6 6 M192 64 l3 -10 l-6 6" stroke="${dk}" stroke-width="3"/><ellipse cx="115" cy="83" rx="5" ry="10" fill="#e8b7a0" transform="rotate(-18 115 83)"/><ellipse cx="185" cy="83" rx="5" ry="10" fill="#e8b7a0" transform="rotate(18 185 83)"/>`;
  if(k==='dog')earsFront=`<ellipse cx="97" cy="128" rx="18" ry="38" fill="${dk}" transform="rotate(16 97 128)"/><ellipse cx="203" cy="128" rx="18" ry="38" fill="${dk}" transform="rotate(-16 203 128)"/>`;
  const hr=sq?50:55,hc=sq?125:122;
  // faces
  const shine=(x,y)=>`<circle cx="${x-3}" cy="${y-4}" r="3.2" fill="#fff"/><circle cx="${x+3}" cy="${y+3}" r="1.5" fill="#fff"/>`;
  if(k==='cat')face=`<g class="blink"><ellipse cx="128" cy="120" rx="10" ry="12" fill="#4f9d5d"/><ellipse cx="172" cy="120" rx="10" ry="12" fill="#4f9d5d"/><ellipse cx="128" cy="121" rx="4" ry="9" fill="#1d1d1d"/><ellipse cx="172" cy="121" rx="4" ry="9" fill="#1d1d1d"/>${shine(128,119)}${shine(172,119)}</g>
    <path d="M144 138 L156 138 L150 145 Z" fill="#ff8fb1"/><path d="M150 145 Q150 153 142 154 M150 145 Q150 153 158 154" stroke="#5a3a3a" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <path d="M136 146 L100 140 M136 150 L100 153 M164 146 L200 140 M164 150 L200 153" stroke="${k==='cat'&&f==='#3a3540'?'#ddd':'#6b5050'}" stroke-width="1.6" opacity=".7"/>`;
  if(k==='dog')face=`<ellipse cx="150" cy="146" rx="29" ry="21" fill="${lt}"/><g class="blink"><circle cx="128" cy="116" r="9.5" fill="#2b1d16"/><circle cx="172" cy="116" r="9.5" fill="#2b1d16"/>${shine(128,116)}${shine(172,116)}</g>
    <ellipse cx="150" cy="137" rx="10.5" ry="7.5" fill="#2b1d16"/><circle cx="147" cy="135" r="2.4" fill="#fff" opacity=".6"/><path d="M150 144 Q150 152 141 154 M150 144 Q150 152 159 154" stroke="#2b1d16" stroke-width="2.4" fill="none" stroke-linecap="round"/><path d="M144 154 Q150 168 156 154 Z" fill="#ff7f9a"/>`;
  if(sq)face=`<circle cx="122" cy="142" r="16" fill="${lt}"/><circle cx="178" cy="142" r="16" fill="${lt}"/><g class="blink"><circle cx="128" cy="118" r="10.5" fill="#1d130e"/><circle cx="172" cy="118" r="10.5" fill="#1d130e"/>${shine(128,118)}${shine(172,118)}</g>
    <ellipse cx="150" cy="136" rx="6.5" ry="4.5" fill="#3a2418"/><path d="M140 143 Q150 150 160 143" stroke="#3a2418" stroke-width="2.2" fill="none" stroke-linecap="round"/><rect x="145.5" y="146" width="9" height="8" rx="2" fill="#fff" stroke="#d8cfc4" stroke-width="1"/><line x1="150" y1="146" x2="150" y2="154" stroke="#d8cfc4" stroke-width="1"/>`;
  const blush=`<ellipse cx="114" cy="140" rx="9" ry="5" fill="#ff8fb1" opacity=".45"/><ellipse cx="186" cy="140" rx="9" ry="5" fill="#ff8fb1" opacity=".45"/>`;
  // the body
  let body=`<ellipse cx="108" cy="256" rx="28" ry="30" fill="${f}"/><ellipse cx="192" cy="256" rx="28" ry="30" fill="${f}"/><ellipse cx="98" cy="285" rx="21" ry="9" fill="${f}"/><ellipse cx="202" cy="285" rx="21" ry="9" fill="${f}"/>
    <ellipse cx="150" cy="215" rx="58" ry="68" fill="${f}"/><ellipse cx="150" cy="230" rx="34" ry="44" fill="${lt}"/>`;
  let suit='',paws=`<ellipse cx="130" cy="283" rx="15" ry="10" fill="${f}"/><ellipse cx="170" cy="283" rx="15" ry="10" fill="${f}"/><path d="M125 287 v-5 M131 288 v-5 M165 288 v-5 M171 287 v-5" stroke="${dk}" stroke-width="1.6" stroke-linecap="round"/>`;
  switch(fit.body){

    <g class="pet" id="pet">${back}${tail}${body}${suit}${paws}${ears}<circle cx="${150}" cy="${hc}" r="${hr}" fill="${f}"/>${earsFront}${face}${blush}${mess}${neck}${hat}</g>${front}<g id="fx">${T.foam.map(bubble).join('')}</g></svg>`;

/* ---------- sounds ---------- */
let ac=null;
function actx(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();return ac;}catch(e){return null;}}
function voice(kind){
  if(!actx())return;
  const t=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(0,t);
  if(kind==='cat'){o.type='triangle';o.frequency.setValueAtTime(620,t);o.frequency.linearRampToValueAtTime(980,t+.18);o.frequency.linearRampToValueAtTime(560,t+.55);g.gain.linearRampToValueAtTime(.25,t+.05);g.gain.linearRampToValueAtTime(0,t+.6);o.start(t);o.stop(t+.62);}
  else if(kind==='dog'){o.type='sawtooth';[0,.28].forEach(d=>{o.frequency.setValueAtTime(330,t+d);o.frequency.exponentialRampToValueAtTime(170,t+d+.14);g.gain.setValueAtTime(.18,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.16);});o.start(t);o.stop(t+.48);}
  else{o.type='sine';for(let i=0;i<6;i++){const d=i*.07;o.frequency.setValueAtTime(1700,t+d);o.frequency.exponentialRampToValueAtTime(2600,t+d+.04);g.gain.setValueAtTime(.16,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.05);}o.start(t);o.stop(t+.45);}
}
function sfx(type){
  const a=actx();if(!a)return;const t=a.currentTime;
  if(type==='splash'||type==='whoosh'){const now=Date.now();if(now-T.snd<320)return;T.snd=now;
    const len=type==='splash'?.35:.4,buf=a.createBuffer(1,a.sampleRate*len|0,a.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();fl.type=type==='splash'?'highpass':'bandpass';fl.frequency.value=type==='splash'?1500:900;g.gain.value=.12;s.buffer=buf;s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(t);return;}
  const o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);
  if(type==='pop'){o.type='sine';o.frequency.setValueAtTime(500+Math.random()*500,t);o.frequency.exponentialRampToValueAtTime(1400,t+.06);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.08);o.start(t);o.stop(t+.09);}
  else if(type==='snip'){o.type='square';[0,.07].forEach(d=>{o.frequency.setValueAtTime(2400-d*4000,t+d);g.gain.setValueAtTime(.07,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.04);});o.start(t);o.stop(t+.12);}
  else if(type==='chomp'){o.type='triangle';[0,.16,.32].forEach(d=>{o.frequency.setValueAtTime(180,t+d);o.frequency.exponentialRampToValueAtTime(90,t+d+.08);g.gain.setValueAtTime(.25,t+d);g.gain.exponentialRampToValueAtTime(.001,t+d+.1);});o.start(t);o.stop(t+.45);}
}

/* ---------- pet care ---------- */
const headOf=k=>k==='squirrel'?[125,50]:[122,55];
// where the fluffy tufts grow: four around the head, one on each side of the body
function tuftPos(k){const [hc,hr]=headOf(k);return [-2.55,-.6,2.75,.4].map(a=>[150+Math.cos(a)*hr,hc+Math.sin(a)*hr,a]).concat([[93,222,Math.PI],[207,222,0]]);}
const bubble=b=>`<circle cx="${b.x.toFixed(1)}" cy="${b.y.toFixed(1)}" r="${b.r.toFixed(1)}" fill="#fff" fill-opacity=".88" stroke="#cfe6ff" stroke-width="1.2"/><circle cx="${(b.x-b.r*.35).toFixed(1)}" cy="${(b.y-b.r*.35).toFixed(1)}" r="${(b.r*.25).toFixed(1)}" fill="#fff"/>`;
const rnd=(a,b)=>a+Math.random()*(b-a);
function tick(){const now=Date.now();
  for(const k in S.care){const C=S.care[k],h=Math.max(0,(now-C.t)/36e5);
    C.food=Math.max(0,C.food-h*6);C.clean=Math.max(0,C.clean-h*1.5);
    if(C.tufts.length<6){C.grow+=h;while(C.grow>=8&&C.tufts.length<6){C.tufts.push([0,1,2,3,4,5].find(i=>!C.tufts.includes(i)));C.grow-=8;}}else C.grow=0;
    if(C.cutAt&&now-C.cutAt>48*36e5){C.nails=C.nails.map(()=>1);C.cutAt=0;}
    C.t=now;}
  save();}
function needs(){const C=S.care[S.kind],n=[];if(C.food<40)n.push('🍖');if(C.clean<50)n.push('🛁');if(C.tufts.length>=3)n.push('✂️');if(C.nails.filter(Boolean).length>=3)n.push('💅');return n;}
function renderNeeds(){const n=needs();let el=$('#needs');if(!n.length){if(el)el.remove();return;}
  if(!el){el=document.createElement('div');el.id='needs';el.className='needs';$('#stage').appendChild(el);}el.textContent='💭 '+n.join(' ');}
const bars=()=>{const C=S.care[S.kind],r=(n,v)=>`<div class="bar">${n}<i><b style="width:${Math.round(v)}%"></b></i></div>`;
  return r('🍖 Tummy',C.food)+r('🫧 Clean',C.clean)+r('✂️ Tidy fur',100-C.tufts.length/6*100)+r('🐾 Short nails',C.nails.filter(x=>!x).length/6*100);};
function updateBars(){const b=$('#bars');if(b)b.innerHTML=bars();renderNeeds();}
function say(text){const b=document.createElement('div');b.className='say';b.textContent=text;$('#stage').appendChild(b);setTimeout(()=>b.remove(),1200);}
// svg point -> spot on the stage, for floating hearts
function stageXY(x,y){const svg=$('#stage svg'),P=svg.createSVGPoint();P.x=x;P.y=y;const q=P.matrixTransform(svg.getScreenCTM()),r=$('#stage').getBoundingClientRect();return [q.x-r.left,q.y-r.top];}
function hearts(n=4,e='💖'){const [x,y]=stageXY(150,120);for(let i=0;i<n;i++)setTimeout(()=>{const s=document.createElement('span');s.className='float';s.textContent=e;s.style.left=(x+rnd(-60,50))+'px';s.style.top=(y+rnd(-30,30))+'px';$('#stage').appendChild(s);setTimeout(()=>s.remove(),1100);},i*120);}
function fxAdd(html,ms=650){const g=$('#fx');if(!g)return;const t=document.createElementNS('http://www.w3.org/2000/svg','g');t.innerHTML=html;g.appendChild(t);setTimeout(()=>t.remove(),ms);}
function hello(){const p=$('#pet');if(!p)return;p.classList.remove('hop');void p.getBoundingClientRect();p.classList.add('hop');voice(S.kind);
  const C=S.care[S.kind];say(C.food<40?"I'm hungry! 🍖":C.clean<50?'Bath time? 🛁':KINDS.find(x=>x.id===S.kind).say);}
function onPet(x,y){const [hc,hr]=headOf(S.kind);return Math.hypot(x-150,y-hc)<hr+8||((x-150)/66)**2+((y-215)/76)**2<1||(y>225&&y<300&&x>70&&x<230);}

function feed(e){const C=S.care[S.kind];if(T.eating)return;if(C.food>=95){say("I'm full! 😋");return;}
  const g=$('#fx');if(!g)return;T.eating=1;
  const el=document.createElementNS('http://www.w3.org/2000/svg','text');el.setAttribute('text-anchor','middle');el.textContent=e;g.appendChild(el);
  const t0=performance.now(),[,hr]=headOf(S.kind),my=S.kind==='squirrel'?150:150;
  (function step(now){const k=Math.min(1,(now-t0)/750),x=246+(150-246)*k,y=300+(my-300)*k-Math.sin(k*Math.PI)*50;
    el.setAttribute('x',x.toFixed(1));el.setAttribute('y',y.toFixed(1));el.setAttribute('font-size',(30*(1-k*.45)).toFixed(1));
    if(k<1)return requestAnimationFrame(step);
    el.remove();T.eating=0;C.food=Math.min(100,C.food+30);save();renderStage();updateBars();sfx('chomp');say(C.food>=95?'Yum! All full! 😋':'Nom nom! 😋');hearts(3);})(t0);}

let down=false;
function careAct(e,tap){
  const svg=$('#stage svg');if(!svg)return;const P=svg.createSVGPoint();P.x=e.clientX;P.y=e.clientY;const p=P.matrixTransform(svg.getScreenCTM().inverse());
  const C=S.care[S.kind],on=onPet(p.x,p.y),tool=S.tool,fx=$('#fx');
  if(!tap&&T.last&&Math.hypot(p.x-T.last.x,p.y-T.last.y)<7)return;T.last={x:p.x,y:p.y};
  if(!tool){if(tap&&on)hello();return;}
  if(tool==='soap'){if(!on)return;if(T.foam.length<70){const b={x:p.x+rnd(-4,4),y:p.y+rnd(-4,4),r:rnd(6,12)};T.foam.push(b);fx.insertAdjacentHTML('beforeend',bubble(b));}
    T.soaped++;if(tap||T.soaped%5===0)sfx('pop');if(T.soaped===24)say('So bubbly! 🫧');return;}
  if(tool==='rinse'){fxAdd([0,1,2].map(i=>`<path class="drip" d="M${p.x+i*7-7} ${p.y-6} q4 7 0 9 q-4 -2 0 -9z" fill="#5fb8ff"/>`).join(''));sfx('splash');
    const n=T.foam.length;T.foam=T.foam.filter(b=>Math.hypot(b.x-p.x,b.y-p.y)>24);
    if(T.foam.length!==n)fx.innerHTML=T.foam.map(bubble).join('');
    if(!T.foam.length&&T.soaped>=15&&!T.rinsed){T.rinsed=1;T.wet=1;C.clean=100;save();renderStage();updateBars();say('Squeaky clean! ✨');}
    else if(!T.foam.length&&T.soaped<15&&tap&&on)say('Soap first! 🧼');return;}
  if(tool==='dry'){if(!on)return;fxAdd(`<circle class="puff" cx="${p.x}" cy="${p.y}" r="8" fill="#fff" opacity=".8"/>`);sfx('whoosh');
    if(T.wet&&++T.dry>=20){T.wet=0;T.dry=0;T.soaped=0;T.rinsed=0;renderStage();say('So fluffy! 💕');hearts();}return;}
  if(tool==='brush'){if(!on)return;fxAdd(`<text class="puff" x="${p.x}" y="${p.y}" font-size="13" text-anchor="middle">✨</text>`);if(++T.brush%15===0){hearts(3);voice(S.kind);}return;}
  if(!tap)return;
  if(tool==='trim'){let best=-1,bd=26;tuftPos(S.kind).forEach(([x,y],i)=>{const d=Math.hypot(x-p.x,y-p.y);if(C.tufts.includes(i)&&d<bd){bd=d;best=i;}});if(best<0)return;
    const [x,y]=tuftPos(S.kind)[best];C.tufts=C.tufts.filter(i=>i!==best);save();renderStage();updateBars();sfx('snip');
    fxAdd([0,1,2,3].map(i=>`<path class="drip" d="M${x+i*5-8} ${y} l3 7 l-6 0z" fill="${S.fur[S.kind]}"/>`).join(''));
    if(!C.tufts.length){say('Looking sharp! ✂️');hearts();}return;}
  if(tool==='clip'||tool==='polish'){let best=-1,bd=12;NAILPOS.forEach(([x,y],i)=>{const d=Math.hypot(x-p.x,y-p.y);if(d<bd){bd=d;best=i;}});if(best<0)return;
    if(tool==='clip'){if(!C.nails[best]){say('Already short!');return;}C.nails[best]=0;C.cutAt=Date.now();sfx('snip');save();renderStage();updateBars();if(C.nails.every(x=>!x)){say('Nice neat nails! 🐾');hearts();}}
    else{C.polish[best]=S.polishC;sfx('pop');save();renderStage();if(C.polish.every(x=>x)){say('So pretty! 💅');hearts(4,'💅');}}}
}
$('#stage').addEventListener('pointerdown',e=>{if(S.mode!=='care')return;down=true;T.last=null;careAct(e,true);});
$('#stage').addEventListener('pointermove',e=>{if(down)careAct(e,false);});
['pointerup','pointercancel','pointerleave'].forEach(t=>$('#stage').addEventListener(t,()=>{down=false;}));

/* ---------- screen ---------- */
const grid=(act,list,sel)=>`<div class="grid">${list.map(x=>`<button class="item ${sel===x.id?'on':''}" data-act="${act}" data-id="${x.id}"><span class="big">${x.e}</span>${x.name}</button>`).join('')}</div>`;
const sw=(act,list,sel)=>`<div class="swatches">${list.map(c=>`<button class="sw ${sel===c?'on':''}" style="background:${c}" data-act="${act}" data-id="${c}" aria-label="${c}"></button>`).join('')}</div>`;
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function renderStage(){const st=$('#stage'),care=S.mode==='care';st.classList.toggle('care',care);
  st.innerHTML=petSVG()+(care&&S.tool?`<div class="hint">${TOOLS[S.tool]}</div>`:'');renderNeeds();
  if(!care)$('#pet').addEventListener('click',hello);}
function dressPanel(){const fit=S.fit[S.kind];
  return `<h3>Name</h3><div class="row"><input id="petName" maxlength="16" value="${esc(S.names[S.kind])}" aria-label="Pet name"></div>
    <h3>🎃 Costume</h3>${grid('body',COSTUMES,fit.body)}
    <h3>🎩 Hat</h3>${grid('hat',HATS,fit.hat)}
    <h3>🎀 Neck</h3>${grid('neck',NECKS,fit.neck)}
    <h3>🖍️ Costume color</h3>${sw('color',COLORS,fit.c)}
    <h3>🎨 Fur</h3>${sw('fur',FUR[S.kind],S.fur[S.kind])}
    <h3>📍 Place</h3>${grid('bg',PLACES,S.bg)}`;}
function carePanel(){const tool=(id,e,n)=>({id,e,name:n});
  return `<h3>💗 How is ${esc(S.names[S.kind])}?</h3><div class="bars" id="bars">${bars()}</div>
    <h3>🍽️ Feed</h3>${grid('feed',FOODS[S.kind].concat([['🍪','Treat']]).map(([e,n])=>({id:e,e,name:n})),null)}
    <h3>🛁 Bath time</h3>${grid('tool',[tool('soap','🧼','Soap'),tool('rinse','🚿','Rinse'),tool('dry','🌬️','Dry')],S.tool)}
    <h3>✂️ Haircut</h3>${grid('tool',[tool('trim','✂️','Trim'),tool('brush','✨','Brush')],S.tool)}
    <h3>💅 Nails</h3>${grid('tool',[tool('clip','🐾','Clip'),tool('polish','💅','Polish')],S.tool)}
    <div style="margin-top:10px">${sw('polishc',COLORS,S.tool==='polish'?S.polishC:null)}</div>
    <div class="row" style="margin-top:10px"><button class="pill" data-act="paintall">💅 Paint all</button><button class="pill soft" data-act="wipe">🧽 Remove polish</button></div>`;}
function renderPanel(){
  $('#pets').innerHTML=KINDS.map(k=>`<button class="${S.kind===k.id?'on':''}" data-kind="${k.id}"><span>${k.e}</span>${k.name}</button>`).join('');
  $('#modes').innerHTML=[['dress','🎃 Dress up'],['care','🛁 Pet care']].map(([id,n])=>`<button class="${S.mode===id?'on':''}" data-mode="${id}">${n}</button>`).join('');
  const sc=$('#content').scrollTop;
  $('#content').innerHTML=(S.mode==='care'?carePanel():dressPanel())+`<div class="soon">🚧 <b>Coming soon:</b> more pets, more costumes, and taking your pet into the dress-up game. Tap your pet to say hi!</div>`;
  $('#content').scrollTop=sc;
  const n=$('#petName');if(n)n.addEventListener('input',e=>{S.names[S.kind]=e.target.value.trim()||KINDS.find(x=>x.id===S.kind).name;save();});
}
function render(){renderStage();renderPanel();}
const freshT=()=>({foam:[],soaped:0,rinsed:0,wet:0,dry:0,brush:0,last:null,snd:0});
$('#pets').addEventListener('click',e=>{const b=e.target.closest('[data-kind]');if(!b)return;S.kind=b.dataset.kind;T=freshT();save();render();});
$('#modes').addEventListener('click',e=>{const b=e.target.closest('[data-mode]');if(!b||S.mode===b.dataset.mode)return;S.mode=b.dataset.mode;S.tool=null;T=freshT();save();render();$('#content').scrollTop=0;});
$('#content').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const fit=S.fit[S.kind],C=S.care[S.kind],id=b.dataset.id;
  switch(b.dataset.act){case 'body':fit.body=id;break;case 'hat':fit.hat=id;break;case 'neck':fit.neck=id;break;case 'color':fit.c=id;break;case 'fur':S.fur[S.kind]=id;break;case 'bg':S.bg=id;break;
    case 'feed':feed(id);return;
    case 'tool':S.tool=S.tool===id?null:id;T.last=null;break;
    case 'polishc':S.polishC=id;S.tool='polish';break;
    case 'paintall':C.polish=C.polish.map(()=>S.polishC);sfx('pop');hearts(3,'💅');break;
    case 'wipe':C.polish=C.polish.map(()=>0);break;}
  save();render();});
$('#randBtn').onclick=()=>{if(S.mode==='care'){S.mode='dress';S.tool=null;}const r=a=>a[Math.random()*a.length|0],fit=S.fit[S.kind];fit.body=r(COSTUMES.slice(1)).id;fit.hat=r(HATS).id;fit.neck=r(NECKS).id;fit.c=r(COLORS);save();render();};
tick();setInterval(()=>{tick();updateBars();},60000);
render();
</script>
</body>
</html>
