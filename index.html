<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Brynny's Dress-Up Studio</title>
<meta name="description" content="A dress-up game made for Brynny's birthday.">
<meta name="theme-color" content="#ff8fc1">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👗</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff6fae;--pink2:#ffd6ea;--purple:#8e6cff;--ink:#3b2357;--bg:#fff4fa;--muted:#8a7499}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:Fredoka,"Trebuchet MS",system-ui,sans-serif}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input{font-family:inherit}
header.top{display:flex;align-items:center;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(90deg,#ff8fc1,#b79cff);color:#fff}
.who{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.28);padding:6px 12px;border-radius:999px;font-weight:600;font-size:17px;min-width:0;color:#fff}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:38vw}
.spacer{flex:1}
.tbtn{background:#fff;color:var(--ink);border-radius:999px;padding:8px 13px;font-weight:600;font-size:15px;box-shadow:0 2px 0 rgba(0,0,0,.12);display:flex;gap:5px;align-items:center;white-space:nowrap}
.tbtn:active{transform:translateY(1px)}
@media (max-width:560px){.tbtn .lbl{display:none}.tbtn{padding:8px 11px;font-size:18px}}
main{flex:1;display:flex;min-height:0}
.stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0;overflow:hidden;background:#fff}
.stage{transition:background .4s}
.stage>svg{height:calc(100% - 20px);width:auto;max-width:calc(100% - 20px);aspect-ratio:380/680;display:block;border-radius:20px;box-shadow:0 6px 24px rgba(59,35,87,.18)}
.panel{width:min(470px,46vw);display:flex;flex-direction:column;background:#fff;border-left:3px solid var(--pink2);min-height:0}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:8px;scrollbar-width:none;border-bottom:2px solid var(--pink2);flex:0 0 auto}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 9px;border-radius:14px;font-size:12px;font-weight:600;color:var(--muted)}
.tab .ico{font-size:24px;line-height:1.1}
.tab.on{background:var(--pink2);color:var(--ink)}
.content{flex:1;overflow-y:auto;padding:4px 12px 24px;-webkit-overflow-scrolling:touch}
h3{margin:14px 2px 8px;font-size:16px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:9px}
.item{background:#fff7fb;border:3px solid #f6e3ef;border-radius:16px;padding:4px;aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:0;overflow:hidden}
.item svg{width:100%;flex:1;min-height:0}
.item .nm{font-size:11px;font-weight:600;color:var(--muted);text-align:center;line-height:1.1;padding:1px 0 2px}
.item.on{border-color:var(--pink);background:#ffe6f2}
.item.on .nm{color:var(--ink)}
.item .big{font-size:30px;flex:1;display:flex;align-items:center}
.swatches{display:flex;flex-wrap:wrap;gap:9px}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #eadcf0;position:relative}
.sw.on{box-shadow:0 0 0 4px var(--pink)}
.sw.none{background:#fff}
.sw.none::after{content:"";position:absolute;left:50%;top:5px;bottom:5px;width:3px;margin-left:-1.5px;background:#ff6b6b;transform:rotate(45deg);border-radius:2px}
.sw.rainbow{background:conic-gradient(#ff5a5a,#ffb347,#ffe066,#7ee081,#4fb6ff,#b388ff,#ff5a5a)}
.seg{display:flex;background:#f6e3ef;border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:10px;border-radius:999px;font-weight:600;font-size:15px}
.seg button.on{background:#fff;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.hint{font-size:13px;color:var(--muted);margin:6px 2px}
@media (max-width:760px){
  main{flex-direction:column}
  .stage{flex:0 0 47%}
  .panel{width:100%;border-left:none;border-top:3px solid var(--pink2);flex:1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
}
.modal{position:fixed;inset:0;background:rgba(59,35,87,.45);display:none;align-items:center;justify-content:center;padding:14px;z-index:20}
.modal.show{display:flex}
.sheet{background:#fff;border-radius:24px;max-width:680px;width:100%;max-height:90vh;max-height:90dvh;overflow:auto;padding:18px;position:relative}
.sheet h2{margin:0 0 12px;font-size:22px}
.close{position:absolute;right:12px;top:10px;font-size:26px;width:40px;height:40px;border-radius:50%;background:#f6e3ef}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.card{border:3px solid #f6e3ef;border-radius:18px;padding:8px;display:flex;flex-direction:column;gap:6px;background:#fff7fb}
.card.on{border-color:var(--pink)}
.card svg{width:100%;aspect-ratio:380/680;border-radius:12px;background:#fff;display:block}
.card .row{display:flex;gap:6px}
.card .row button{flex:1}
.card input{width:100%;font-size:16px;font-weight:600;border:2px solid #eadcf0;border-radius:10px;padding:6px 8px;color:var(--ink);background:#fff}
.pill{background:var(--pink);color:#fff;border-radius:999px;padding:8px 12px;font-weight:600;font-size:14px}
.pill.soft{background:#f6e3ef;color:var(--ink)}
.pill.warn{background:#ff6b6b}
.small{font-size:12px;color:var(--muted)}
.addrow{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.addrow input{flex:1;min-width:150px;font-size:17px;border:2px solid #eadcf0;border-radius:12px;padding:10px 12px;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(30px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.3s;z-index:40;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spark{position:absolute;font-size:26px;pointer-events:none;animation:pop .9s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.3)}30%{opacity:1;transform:scale(1.2)}100%{opacity:0;transform:scale(.8) translateY(-30px)}}
#welcome{position:fixed;inset:0;z-index:30;background:linear-gradient(160deg,#ffd1e8,#e3d6ff);display:none;align-items:center;justify-content:center;padding:16px;overflow:auto}
#welcome.show{display:flex}
.wbox{background:#fff;border-radius:28px;padding:22px;max-width:440px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(142,108,255,.25)}
.wbox svg{width:180px;height:260px}
.wbox h1{margin:6px 0 4px;font-size:30px;line-height:1.1}
.wbox p{margin:0 0 14px;color:var(--muted)}
.wbox input{width:100%;font-size:22px;text-align:center;border:3px solid #eadcf0;border-radius:16px;padding:12px;color:var(--ink);font-weight:600}
.big-btn{margin-top:14px;width:100%;background:linear-gradient(90deg,#ff6fae,#8e6cff);color:#fff;font-size:22px;font-weight:700;padding:14px;border-radius:18px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<header class="top">
  <button class="who" id="whoBtn" aria-label="Choose who is playing">👧 <span id="whoName">Brynny</span> ▾</button>
  <div class="spacer"></div>
  <button class="tbtn" id="randBtn" title="Surprise me">🎲 <span class="lbl">Surprise</span></button>
  <button class="tbtn" id="saveBtn" title="Save this look">📸 <span class="lbl">Save</span></button>
  <button class="tbtn" id="galBtn" title="My gallery">🖼️ <span class="lbl">Gallery</span></button>
</header>
<main>
  <div class="stage" id="stage"></div>
  <div class="panel">
    <nav class="tabs" id="tabs"></nav>
    <div class="content" id="content"></div>
  </div>
</main>

<div class="modal" id="whoModal"><div class="sheet">
  <button class="close" data-close>×</button>
  <h2>Who's getting dressed up?</h2>
  <div class="cards" id="whoCards"></div>
  <div class="addrow">
    <input id="newName" maxlength="20" placeholder="Add someone: Mom, Ava, Grandma...">
    <button class="pill" id="addWho">➕ Add</button>
  </div>
</div></div>

<div class="modal" id="galModal"><div class="sheet">
  <button class="close" data-close>×</button>
  <h2>📸 My Gallery</h2>
  <div class="cards" id="galCards"></div>
</div></div>

<div id="welcome"><div class="wbox">
  <div id="welcomeArt"></div>
  <h1>Happy Birthday!</h1>
  <p>Welcome to your very own Dress-Up Studio 🎀</p>
  <input id="welcomeName" maxlength="20" value="Brynny" aria-label="Your name">
  <button class="big-btn" id="welcomeGo">Let's play! ✨</button>
</div></div>

<div class="toast" id="toast"></div>

<script>
/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shade(hex,amt){
  if(!hex||hex[0]!=='#')return hex;
  const n=parseInt(hex.slice(1),16),r=n>>16,g=n>>8&255,b=n&255;
  const f=v=>Math.max(0,Math.min(255,Math.round(amt<0?v*(1+amt):v+(255-v)*amt)));
  return '#'+[f(r),f(g),f(b)].map(v=>v.toString(16).padStart(2,'0')).join('');
}
const sym=s=>s+`<g transform="matrix(-1 0 0 1 300 0)">${s}</g>`;
function star(cx,cy,r,fill,extra=''){
  const p=[];for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r*.45:r;p.push((cx+rr*Math.cos(a)).toFixed(1)+','+(cy+rr*Math.sin(a)).toFixed(1));}
  return `<polygon points="${p.join(' ')}" fill="${fill}" ${extra}/>`;
}
function heart(x,y,s,fill,extra=''){
  return `<path d="M${x} ${y+s} C${x-s*1.6} ${y} ${x-s*.9} ${y-s*1.2} ${x} ${y-s*.35} C${x+s*.9} ${y-s*1.2} ${x+s*1.6} ${y} ${x} ${y+s} Z" fill="${fill}" ${extra}/>`;
}
function flower(x,y,r,c,center='#ffd84d'){
  let s='';for(let i=0;i<5;i++){const a=i*Math.PI*2/5-Math.PI/2;s+=`<circle cx="${(x+r*Math.cos(a)).toFixed(1)}" cy="${(y+r*Math.sin(a)).toFixed(1)}" r="${(r*.72).toFixed(1)}" fill="${c}"/>`;}
  return s+`<circle cx="${x}" cy="${y}" r="${(r*.55).toFixed(1)}" fill="${center}"/>`;
}
const rnd=a=>a[Math.floor(Math.random()*a.length)];

/* ---------- palettes ---------- */
const SKIN=['#ffe3cc','#f7cfae','#eab38c','#d49a6a','#b97a4f','#8d5a3b','#6b4128','#4a2c1c'];
const EYES=['#6b4423','#2f6fb5','#3c8d5a','#9a6a3a','#6b7b8c','#8a4fbf','#1f1a24'];
const HAIRC=['#2b1d16','#4a2c1a','#7a4a2a','#a0441f','#d9a35a','#f3e2a9','#ff7eb6','#b388ff','#4fb6ff','#2ec4b6','#ff5a5a','rainbow'];
const CLOTHC=['#ff6fae','#ff4d6d','#ff8a3d','#ffd23f','#7ee081','#2ec4b6','#4fc3f7','#5c7cfa','#b388ff','#8e44ad','#ffd1e6','#ffffff','#bfe9ff','#e8d9b5','#a0522d','#2d2d3a','#e0b04a'];
const SHADOW=['#ff8fc8','#b388ff','#6ec6ff','#7ee081','#ffd27a','#c69c6d','#e0b0ff','#5b3a7a'];
const LIPS=['#ff4d6d','#e0457b','#ff8fb8','#c2185b','#ff8a65','#b5651d','#8e44ad','#d98a8a'];
const BLUSH=['#ff7aa8','#ff9a8b','#f48fb1','#e57373'];

const hf=c=>c==='rainbow'?'url(#rbHair)':c;
const hs=c=>c==='rainbow'?'#8e6cff':shade(c,-.3);

const DEFS=`<defs>
<linearGradient id="rbHair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff5a5a"/><stop offset=".2" stop-color="#ffb347"/><stop offset=".4" stop-color="#ffe066"/><stop offset=".6" stop-color="#7ee081"/><stop offset=".8" stop-color="#4fb6ff"/><stop offset="1" stop-color="#b388ff"/></linearGradient>
<linearGradient id="gStudio" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd6ec"/><stop offset="1" stop-color="#e6dcff"/></linearGradient>
<linearGradient id="gNight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#140a2e"/><stop offset="1" stop-color="#5a2a7a"/></linearGradient>
<linearGradient id="gXmas" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d2340"/><stop offset="1" stop-color="#3a6aa8"/></linearGradient>
<linearGradient id="gBeach" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fd0ff"/><stop offset="1" stop-color="#e3f7ff"/></linearGradient>
<linearGradient id="gWed" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff9fb"/><stop offset="1" stop-color="#ffe1ec"/></linearGradient>
<linearGradient id="gBday" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c9"/><stop offset="1" stop-color="#ffd6ec"/></linearGradient>
<radialGradient id="gSpot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
</defs>`;

/* ---------- body ---------- */
const TORSO_BODY='M112 158 Q150 148 188 158 Q198 162 198 178 Q190 220 182 258 Q196 280 196 300 L104 300 Q104 280 118 258 Q110 220 102 178 Q102 162 112 158 Z';
const headT=L=>L.style==='cartoon'?'translate(150 135) scale(1.3) translate(-150 -135)':'translate(0 0)';

function body(L){
  const sk=L.skin,d=shade(sk,-.15);
  let s='';
  s+=sym(`<polyline points="110,170 94,250 88,322" fill="none" stroke="${sk}" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>`);
  s+=sym(`<path d="M106 290 L150 296 L148 300 L146 430 L142 556 L126 556 L118 430 Z" fill="${sk}"/><ellipse cx="134" cy="562" rx="11" ry="7" fill="${sk}"/><path d="M122 430 Q132 436 142 430" stroke="${d}" stroke-width="2" fill="none" opacity=".6"/>`);
  s+=`<path d="M139 110 L161 110 L162 162 L138 162 Z" fill="${sk}"/><path d="M139 132 Q150 146 161 132 L161 146 Q150 156 139 146 Z" fill="${d}" opacity=".45"/>`;
  s+=`<path d="${TORSO_BODY}" fill="${sk}"/>`;
  s+=`<path d="M118 168 Q150 180 182 168 L190 186 Q187 222 183 258 L117 258 Q113 222 110 186 Z" fill="#fff0f6"/>`;
  s+=`<path d="M117 254 L183 254 Q196 280 196 302 L156 312 L150 324 L144 312 L104 302 Q104 280 117 254 Z" fill="#fff0f6"/>`;
  return s;
}
const hands=L=>sym(`<circle cx="88" cy="328" r="10" fill="${L.skin}"/>`);

function face(L){
  const toon=L.style==='cartoon',rx=9,ry=toon?10:5.6,ir=toon?7:4.6,ey=92;
  const sk=L.skin,d=shade(sk,-.18),bc=L.hairColor==='rainbow'?'#6b4a8a':shade(L.hairColor,-.35);
  const m=L.makeup||{};
  let s=sym(`<ellipse cx="111" cy="94" rx="6" ry="9" fill="${sk}"/><ellipse cx="111" cy="94" rx="3" ry="5" fill="${d}" opacity=".4"/>`);
  s+=`<ellipse cx="150" cy="88" rx="40" ry="46" fill="${sk}"/>`;
  let one='';
  if(m.shadow) one+=`<path d="M${134-rx-3} ${ey-ry*.2} Q134 ${ey-ry-12} ${134+rx+3} ${ey-ry*.2} Q134 ${ey-ry*1.1} ${134-rx-3} ${ey-ry*.2} Z" fill="${m.shadow}" opacity=".75"/>`;
  const iy=ey+(toon?1:0);
  one+=`<ellipse cx="134" cy="${ey}" rx="${rx}" ry="${ry}" fill="#fff"/><circle cx="134" cy="${iy}" r="${ir}" fill="${L.eyes}"/><circle cx="134" cy="${iy}" r="${ir*.5}" fill="#1e1424"/><circle cx="${134+ir*.38}" cy="${iy-ir*.38}" r="${ir*.3}" fill="#fff"/>`;
  if(toon) one+=`<circle cx="${134-ir*.4}" cy="${iy+ir*.4}" r="${ir*.15}" fill="#fff"/>`;
  const lash=m.lashes||'natural',lw=lash==='bold'?3.4:lash==='long'?2.5:1.9;
  const P0=[134-rx-1,ey],P1=[134,ey-ry*1.65],P2=[134+rx+1,ey];
  one+=`<path d="M${P0[0]} ${P0[1]} Q${P1[0]} ${P1[1]} ${P2[0]} ${P2[1]}" fill="none" stroke="#2b1a2e" stroke-width="${lw}" stroke-linecap="round"/>`;
  if(lash!=='natural'){
    const n=lash==='bold'?4:3,len=lash==='bold'?7:5.5;
    for(let i=0;i<n;i++){const t=.06+i*.12,x=(1-t)**2*P0[0]+2*t*(1-t)*P1[0]+t*t*P2[0],y=(1-t)**2*P0[1]+2*t*(1-t)*P1[1]+t*t*P2[1];
      one+=`<line x1="${x.toFixed(1)}" y1="${y.toFixed(1)}" x2="${(x-len*.8).toFixed(1)}" y2="${(y-len*.75).toFixed(1)}" stroke="#2b1a2e" stroke-width="${lw*.7}" stroke-linecap="round"/>`;}
  }
  one+=`<path d="M123 ${ey-ry-8} Q134 ${ey-ry-14} 145 ${ey-ry-9}" fill="none" stroke="${bc}" stroke-width="2.8" stroke-linecap="round"/>`;
  if(m.blush) one+=`<ellipse cx="124" cy="109" rx="8.5" ry="4.8" fill="${m.blush}" opacity=".5"/>`;
  s+=sym(one);
  s+=`<path d="M150 99 Q146.5 106 151 108" fill="none" stroke="${d}" stroke-width="2" stroke-linecap="round"/>`;
  if(m.lips) s+=`<path d="M139 117 Q144 112 150 114.5 Q156 112 161 117 Q150 128 139 117 Z" fill="${m.lips}"/><ellipse cx="146" cy="120" rx="3" ry="1.2" fill="#fff" opacity=".5"/>`;
  else s+=`<path d="M140 116 Q150 124 160 116" fill="none" stroke="#c0636b" stroke-width="2.4" stroke-linecap="round"/>`;
  s+=facePaint(m.paint);
  return s;
}
function facePaint(p){
  switch(p){
    case 'star':return star(121,106,7,'#ffd23f')+star(129,98,3,'#ff8fc8');
    case 'heart':return heart(122,106,6,'#ff4d8d');
    case 'rainbow':{let s='';['#ff5a5a','#ffb347','#ffe066','#7ee081','#4fb6ff'].forEach((c,i)=>{const r=11-i*1.6;s+=`<path d="M${123-r} 113 A${r} ${r} 0 0 1 ${123+r} 113" fill="none" stroke="${c}" stroke-width="1.8"/>`;});return s;}
    case 'whiskers':return sym(`<path d="M127 108 L106 102 M127 111 L105 111 M127 114 L107 120" stroke="#2b1a2e" stroke-width="1.6" stroke-linecap="round"/>`)+`<path d="M145 102 L155 102 L150 108 Z" fill="#2b1a2e"/>`;
    case 'pumpkin':return `<ellipse cx="122" cy="107" rx="7" ry="6" fill="#ff8a1f"/><path d="M122 101 L123 98" stroke="#3c8d5a" stroke-width="2"/><path d="M119 106 L120 104 L121 106 Z M123 106 L124 104 L125 106 Z" fill="#3b1d00"/><path d="M119 109 Q122 111 125 109" stroke="#3b1d00" stroke-width="1" fill="none"/>`;
    case 'snow':return `<g stroke="#4fb6ff" stroke-width="1.6" stroke-linecap="round"><line x1="122" y1="99" x2="122" y2="113"/><line x1="116" y1="102.5" x2="128" y2="109.5"/><line x1="116" y1="109.5" x2="128" y2="102.5"/></g>`;
    case 'glitter':{let s='';[[118,88,'#ffd23f'],[116,96,'#ff8fc8'],[120,101,'#b388ff'],[114,92,'#4fb6ff'],[182,88,'#ffd23f'],[184,96,'#ff8fc8'],[180,101,'#b388ff'],[186,92,'#4fb6ff']].forEach(([x,y,c])=>s+=star(x,y,2.4,c));return s;}
    case 'butterfly':return `<g opacity=".9"><ellipse cx="117" cy="100" rx="6" ry="8" fill="#b388ff" transform="rotate(-25 117 100)"/><ellipse cx="127" cy="100" rx="6" ry="8" fill="#ff8fc8" transform="rotate(25 127 100)"/><ellipse cx="118" cy="110" rx="4" ry="5" fill="#4fb6ff"/><ellipse cx="126" cy="110" rx="4" ry="5" fill="#7ee081"/><line x1="122" y1="97" x2="122" y2="113" stroke="#3b2357" stroke-width="1.5"/></g>`;
  }
  return '';
}

/* ---------- hair ---------- */
const CAP='M108 98 Q103 33 150 32 Q197 33 192 98 Q187 60 150 56 Q113 60 108 98 Z';
const PART='M108 98 Q103 33 150 32 Q197 33 192 98 Q186 58 153 50 L150 60 L147 50 Q114 58 108 98 Z';

function charInner(L){
  const T=headT(L),H=(find(HAIR,L.hairStyle)||HAIR[0]).d(hf(L.hairColor),hs(L.hairColor));
  const hat=L.hat&&find(HATS,L.hat.id)?parts(find(HATS,L.hat.id).d(L.hat.c)):{};
  const ex={back:'',front:'',hand:'',head:''};
  for(const [id,c] of Object.entries(L.extras||{})){const it=find(EXTRAS,id);if(!it)continue;const p=parts(it.d(c));for(const k in ex)ex[k]+=p[k]||'';}
  const wear=(list,v)=>v&&find(list,v.id)?allParts(parts(find(list,v.id).d(v.c))):'';
  let s=ex.back+`<g transform="${T}">${H.back||''}${hat.back||''}</g>`+body(L);
  if(L.dress)s+=wear(DRESSES,L.dress);else s+=wear(BOTTOMS,L.bottom)+wear(TOPS,L.top);
  s+=wear(SHOES,L.shoes)+ex.front+hands(L)+ex.hand;
  s+=`<g transform="${T}">${face(L)}${ex.head}${H.front||''}${hat.front||''}</g>`;
  return s;
}

function randomLook(base){
  const L=defaultLook();L.style=base?base.style:rnd(['cartoon','fashion']);L.skin=base?base.skin:rnd(SKIN);L.eyes=base?base.eyes:rnd(EYES);
  L.hairStyle=rnd(HAIR).id;L.hairColor=rnd(HAIRC);
  const pick=list=>{const it=rnd(list);return {id:it.id,c:Math.random()<.5?it.c:rnd(CLOTHC)};};
  if(Math.random()<.45){L.dress=pick(DRESSES);}else{L.top=pick(TOPS);L.bottom=pick(BOTTOMS);}
  L.shoes=pick(SHOES);L.hat=Math.random()<.5?pick(HATS):null;
  L.extras={};const n=Math.floor(Math.random()*3);for(let i=0;i<n;i++){const e=rnd(EXTRAS);L.extras[e.id]=e.c;}
  L.makeup={shadow:Math.random()<.5?rnd(SHADOW):null,lips:Math.random()<.6?rnd(LIPS):null,blush:rnd(BLUSH),lashes:rnd(LASHES).id,paint:Math.random()<.3?rnd(PAINT).id:null};
  L.scene=rnd(SCENES).id;return L;
}
const uid=()=>Math.random().toString(36).slice(2,9);
function load(){
  try{const d=JSON.parse(localStorage.getItem(STORE));if(d&&d.chars&&d.chars.length)return d;}catch(e){}
  const id=uid();return {chars:[{id,name:'Brynny',look:defaultLook()}],cur:id,gallery:[],welcomed:false};
}
let DB=load();
function persist(){try{localStorage.setItem(STORE,JSON.stringify(DB));}catch(e){}}
const me=()=>DB.chars.find(c=>c.id===DB.cur)||DB.chars[0];
const L=()=>me().look;
let tab='me',lastExtra=null;

/* ---------- UI ---------- */
const TABS=[{id:'me',ico:'🙂',name:'Me'},{id:'hair',ico:'💇‍♀️',name:'Hair'},{id:'makeup',ico:'💄',name:'Makeup'},{id:'tops',ico:'👚',name:'Tops'},{id:'bottoms',ico:'👖',name:'Bottoms'},
  {id:'dresses',ico:'👗',name:'Dresses'},{id:'shoes',ico:'👠',name:'Shoes'},{id:'hats',ico:'👑',name:'Hats'},{id:'extras',ico:'👜',name:'Extras'},{id:'scenes',ico:'🎃',name:'Places'}];

const STAGEBG={studio:'#f6e6fb',bedroom:'#ecd9f7',birthday:'#ffeaf0',halloween:'#2a1440',christmas:'#1d3a63',wedding:'#fff0f5',beach:'#c9eeff',runway:'#1a1028'};
function renderStage(){$('#stage').innerHTML=fullSVG(L(),me().name);$('#stage').style.background=STAGEBG[L().scene]||'#fff';$('#whoName').textContent=me().name;}
function renderTabs(){$('#tabs').innerHTML=TABS.map(t=>`<button class="tab ${t.id===tab?'on':''}" data-tab="${t.id}"><span class="ico">${t.icon||t.ico}</span>${t.name}</button>`).join('');}
function swatches(act,list,sel,{none=false,arg=''}={}){
  let h='<div class="swatches">';if(none)h+=`<button class="sw none ${!sel?'on':''}" data-act="${act}" data-arg="${arg}" data-c="" aria-label="none"></button>`;
  for(const c of list)h+=`<button class="sw ${c==='rainbow'?'rainbow':''} ${sel===c?'on':''}" style="${c==='rainbow'?'':'background:'+c}" data-act="${act}" data-arg="${arg}" data-c="${c}" aria-label="${c}"></button>`;
  return h+'</div>';
}
const tile=(on,act,arg,id,svg,name)=>`<button class="item ${on?'on':''}" data-act="${act}" data-arg="${arg}" data-id="${id}">${svg}<span class="nm">${name}</span></button>`;
const noneTile=(on,act,arg)=>`<button class="item ${on?'on':''}" data-act="${act}" data-arg="${arg}" data-id=""><span class="big">🚫</span><span class="nm">None</span></button>`;

function renderPanel(){
  const l=L();let h='';
  const faceOnly=(extra={})=>{const F={...l,style:'fashion',...extra};return mini('100 38 100 96',`<g>${face(F)}</g>`);};
  if(tab==='me'){
    h+=`<h3>Look style</h3><div class="seg"><button class="${l.style==='cartoon'?'on':''}" data-act="style" data-c="cartoon">😊 Cartoon</button><button class="${l.style==='fashion'?'on':''}" data-act="style" data-c="fashion">💃 Fashion doll</button></div>`;
    h+=`<h3>Skin</h3>`+swatches('skin',SKIN,l.skin)+`<h3>Eyes</h3>`+swatches('eyes',EYES,l.eyes);
    h+=`<h3>Name</h3><div class="addrow" style="margin-top:0"><input id="nameEdit" maxlength="20" value="${esc(me().name)}"></div><p class="hint">Tap 👧 at the top to dress up friends and family too!</p>`;
  }else if(tab==='hair'){
    h+=`<h3>Hair color</h3>`+swatches('hairColor',HAIRC,l.hairColor)+`<h3>Hair style</h3><div class="grid">`;
    for(const it of HAIR){const p=it.d(hf(l.hairColor),hs(l.hairColor));h+=tile(l.hairStyle===it.id,'hair','',it.id,mini('56 -6 188 280',`${p.back||''}<ellipse cx="150" cy="88" rx="40" ry="46" fill="${l.skin}"/>${p.front||''}`),it.name);}
    h+='</div>';
  }else if(tab==='makeup'){
    const m=l.makeup;
    h+=`<h3>Eyeshadow</h3>`+swatches('mk',SHADOW,m.shadow,{none:true,arg:'shadow'})+`<h3>Lipstick</h3>`+swatches('mk',LIPS,m.lips,{none:true,arg:'lips'})+`<h3>Blush</h3>`+swatches('mk',BLUSH,m.blush,{none:true,arg:'blush'});
    h+=`<h3>Lashes</h3><div class="grid">`+LASHES.map(x=>tile(m.lashes===x.id,'mkItem','lashes',x.id,faceOnly({makeup:{...m,lashes:x.id,paint:null}}),x.name)).join('')+'</div>';
    h+=`<h3>Face paint</h3><div class="grid">`+noneTile(!m.paint,'mkItem','paint')+PAINT.map(x=>tile(m.paint===x.id,'mkItem','paint',x.id,faceOnly({makeup:{...m,paint:x.id}}),x.name)).join('')+'</div>';
  }else if(tab==='scenes'){
    h+=`<h3>Where are you going?</h3><div class="grid">`+SCENES.map(s=>tile(l.scene===s.id,'scene','',s.id,mini(VIEW,DEFS+sceneSVG(s.id,'')),s.name)).join('')+'</div>';
  }else if(tab==='extras'){
    h+=`<p class="hint">Tap to add or take off. You can wear lots at once!</p><div class="grid">`;
    for(const it of EXTRAS){const c=l.extras[it.id]||it.c;h+=tile(it.id in l.extras,'extra','',it.id,mini(it.vb,allParts(parts(it.d(c)))),it.name);}
    h+='</div>';
    const sel=lastExtra&&lastExtra in l.extras?lastExtra:Object.keys(l.extras).slice(-1)[0];
    if(sel)h+=`<h3>Color for ${find(EXTRAS,sel).name}</h3>`+swatches('color',CLOTHC,l.extras[sel],{arg:'extras:'+sel});
  }else{
    const list=CATS[tab],k=KEY[tab],cur=l[k];
    if((tab==='tops'||tab==='bottoms')&&l.dress)h+=`<p class="hint">Picking this takes off the dress.</p>`;
    h+=`<div class="grid" style="margin-top:10px">`+noneTile(!cur,'wear',tab);
    for(const it of list){const on=cur&&cur.id===it.id;h+=tile(on,'wear',tab,it.id,mini(VBS[tab],allParts(parts(it.d(on?cur.c:it.c)))),it.name);}
    h+='</div>';
    if(cur)h+=`<h3>Color</h3>`+swatches('color',CLOTHC,cur.c,{arg:tab});
  }
  $('#content').innerHTML=h;
  const ne=$('#nameEdit');if(ne)ne.addEventListener('input',()=>{me().name=ne.value.trim()||'Me';persist();renderStage();});
}
function update(fn,{panel=true}={}){fn(L());persist();renderStage();if(panel){const sc=$('#content').scrollTop;renderPanel();$('#content').scrollTop=sc;}sparkle();}
function sparkle(){const st=$('#stage');for(let i=0;i<4;i++){const s=document.createElement('span');s.className='spark';s.textContent=rnd(['✨','💖','⭐','✨']);s.style.left=(20+Math.random()*60)+'%';s.style.top=(10+Math.random()*70)+'%';st.appendChild(s);setTimeout(()=>s.remove(),900);}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800);}

$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;renderTabs();renderPanel();$('#content').scrollTop=0;});
$('#content').addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const {act,arg,id,c}=b.dataset;
  update(l=>{
    switch(act){
      case 'style':l.style=c;break;
      case 'skin':l.skin=c;break;
      case 'eyes':l.eyes=c;break;
      case 'hairColor':l.hairColor=c;break;
      case 'hair':l.hairStyle=id;break;
      case 'mk':l.makeup[arg]=c||null;break;
      case 'mkItem':l.makeup[arg]=id||null;break;
      case 'scene':l.scene=id;break;
      case 'extra':if(id in l.extras){delete l.extras[id];}else{l.extras[id]=find(EXTRAS,id).c;lastExtra=id;}break;
      case 'wear':{const k=KEY[arg];if(!id){l[k]=null;}else{const it=find(CATS[arg],id);l[k]={id,c:l[k]&&l[k].id===id?l[k].c:it.c};}
        if(id&&(arg==='tops'||arg==='bottoms'))l.dress=null;break;}
      case 'color':if(arg.startsWith('extras:')){const x=arg.slice(7);l.extras[x]=c;lastExtra=x;}else{l[KEY[arg]].c=c;}break;
    }
  });
});

/* header buttons */
$('#randBtn').onclick=()=>{const keep=L();me().look=randomLook(keep);persist();renderStage();renderPanel();sparkle();};
$('#saveBtn').onclick=()=>{DB.gallery.unshift({id:uid(),name:me().name,look:JSON.parse(JSON.stringify(L())),at:Date.now()});DB.gallery=DB.gallery.slice(0,80);persist();toast('📸 Saved to your Gallery!');sparkle();};
$('#galBtn').onclick=()=>{renderGallery();$('#galModal').classList.add('show');};
$('#whoBtn').onclick=()=>{renderWho();$('#whoModal').classList.add('show');};
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m||e.target.hasAttribute('data-close'))m.classList.remove('show');}));

function renderWho(){
  $('#whoCards').innerHTML=DB.chars.map(ch=>`<div class="card ${ch.id===DB.cur?'on':''}">${fullSVG(ch.look,ch.name)}
    <input data-rename="${ch.id}" value="${esc(ch.name)}" maxlength="20" aria-label="Name">
    <div class="row"><button class="pill" data-play="${ch.id}">${ch.id===DB.cur?'Playing ✓':'Play'}</button>${DB.chars.length>1?`<button class="pill soft" data-del="${ch.id}">🗑️</button>`:''}</div></div>`).join('');
}
$('#whoCards').addEventListener('click',e=>{
  const p=e.target.closest('[data-play]'),d=e.target.closest('[data-del]');
  if(p){DB.cur=p.dataset.play;persist();renderStage();renderPanel();$('#whoModal').classList.remove('show');}
  if(d){if(d.dataset.sure){DB.chars=DB.chars.filter(c=>c.id!==d.dataset.del);if(!DB.chars.find(c=>c.id===DB.cur))DB.cur=DB.chars[0].id;persist();renderWho();renderStage();renderPanel();}else{d.dataset.sure=1;d.textContent='Sure?';d.classList.add('warn');}}
});
$('#whoCards').addEventListener('input',e=>{const i=e.target.closest('[data-rename]');if(!i)return;const ch=DB.chars.find(c=>c.id===i.dataset.rename);ch.name=i.value.trim()||'Friend';persist();renderStage();});
$('#addWho').onclick=()=>{const n=$('#newName').value.trim();if(!n){$('#newName').focus();return;}const id=uid();DB.chars.push({id,name:n,look:randomLook()});DB.cur=id;$('#newName').value='';persist();renderStage();renderPanel();$('#whoModal').classList.remove('show');toast(`👋 Say hi to ${n}!`);};
$('#newName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#addWho').click();});

function renderGallery(){
  if(!DB.gallery.length){$('#galCards').innerHTML=`<div class="empty">No photos yet.<br>Tap 📸 to save a look!</div>`;return;}
  $('#galCards').innerHTML=DB.gallery.map(g=>`<div class="card">${fullSVG(g.look,g.name)}<div class="small"><b>${esc(g.name)}</b> · ${new Date(g.at).toLocaleDateString()}</div>
    <div class="row"><button class="pill" data-wear="${g.id}">Wear</button><button class="pill soft" data-dl="${g.id}" title="Download">⬇️</button><button class="pill soft" data-gdel="${g.id}">🗑️</button></div></div>`).join('');
}
$('#galCards').addEventListener('click',e=>{
  const w=e.target.closest('[data-wear]'),dl=e.target.closest('[data-dl]'),d=e.target.closest('[data-gdel]');
  const g=id=>DB.gallery.find(x=>x.id===id);
  if(w){me().look=JSON.parse(JSON.stringify(g(w.dataset.wear).look));persist();renderStage();renderPanel();$('#galModal').classList.remove('show');toast('✨ Outfit back on!');}
  if(dl){const x=g(dl.dataset.dl);exportPNG(x.look,x.name);}
  if(d){if(d.dataset.sure){DB.gallery=DB.gallery.filter(x=>x.id!==d.dataset.gdel);persist();renderGallery();}else{d.dataset.sure=1;d.textContent='Sure?';d.classList.add('warn');}}
});
function exportPNG(look,name){
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1360" viewBox="${VIEW}">${DEFS}${sceneSVG(look.scene,name)}${charInner(look)}</svg>`;
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=760;cv.height=1360;cv.getContext('2d').drawImage(img,0,0);
    cv.toBlob(async b=>{const fn=`${(name||'my').replace(/[^\w-]+/g,'_')}-look.png`;
      try{const f=new File([b],fn,{type:'image/png'});if(/iPhone|iPad|Android/i.test(navigator.userAgent)&&navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:fn});return;}}catch(e){}
      const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=fn;document.body.appendChild(a);a.click();a.remove();},'image/png');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

/* welcome */
function showWelcome(){
  const party={...defaultLook(),dress:{id:'party',c:'#ff8fc8'},hat:{id:'party',c:'#4fc3f7'},scene:'birthday'};
  $('#welcomeArt').innerHTML=`<svg viewBox="40 -40 220 640" xmlns="http://www.w3.org/2000/svg">${DEFS}${charInner(party)}</svg>`;
  $('#welcome').classList.add('show');
}
$('#welcomeGo').onclick=()=>{const n=$('#welcomeName').value.trim()||'Brynny';DB.chars[0].name=n;DB.chars[0].look.scene='birthday';DB.welcomed=true;persist();$('#welcome').classList.remove('show');renderStage();renderPanel();sparkle();};
$('#welcomeName').addEventListener('keydown',e=>{if(e.key==='Enter')$('#welcomeGo').click();});

renderTabs();renderStage();renderPanel();
if(!DB.welcomed)showWelcome();
</script>
</body>
</html>
